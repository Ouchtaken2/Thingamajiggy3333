name: Frickbears3iOS

options:
  bundleIdPrefix: com.fanport.frickbears3
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  Frickbears3iOS:
    type: application
    platform: iOS
    sources:
      - path: App
    resources:
      - path: Game
      - path: PortAssets
    settings:
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          SWIFT_VERSION: "5.0"
          PRODUCT_BUNDLE_IDENTIFIER: com.fanport.frickbears3
        Release:
          CODE_SIGNING_ALLOWED: NO
          CODE_SIGNING_REQUIRED: NO
          SWIFT_VERSION: "5.0"
          PRODUCT_BUNDLE_IDENTIFIER: com.fanport.frickbears3
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Frickbear's 3 4LD"
        CFBundleName: "Frickbears3-4LD"
        CFBundleIdentifier: "com.fanport.frickbears3"
        CFBundleShortVersionString: "2.1.5"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarHidden: true
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
