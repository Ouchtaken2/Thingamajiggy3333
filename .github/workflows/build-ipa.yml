name: Build Frickbear's 3 4LD iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Game/index.html is still the pinned 4LD 2.1.5 loader. PortAssets is a
      # small curated slice of recovered assets for the native port; the web
      # shell continues to fetch its runtime from jsDelivr at launch.

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Frickbears3iOS.xcodeproj \
            -scheme Frickbears3iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Frickbears3iOS.app Payload/

          # XcodeGen does not reliably bundle the Game/ folder, so copy it in
          # explicitly. GameURLSchemeHandler serves from App.app/Game/.
          mkdir -p Payload/Frickbears3iOS.app/Game
          cp -R Game/. Payload/Frickbears3iOS.app/Game/

          # Curated recovered assets for the in-progress native port.
          mkdir -p Payload/Frickbears3iOS.app/PortAssets
          cp -R PortAssets/. Payload/Frickbears3iOS.app/PortAssets/

          # Fail loudly if the loader or asset manifest did not make it in.
          test -f Payload/Frickbears3iOS.app/Game/index.html
          grep -q "FOUR LAYERS DOWN" Payload/Frickbears3iOS.app/Game/index.html
          test -f Payload/Frickbears3iOS.app/PortAssets/manifest.json

          du -sh Payload/Frickbears3iOS.app/Game
          du -sh Payload/Frickbears3iOS.app/PortAssets
          zip -qry Frickbears3iOS.ipa Payload
          ls -lh Frickbears3iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Frickbears3-4LD-IPA
          path: Frickbears3iOS.ipa
          if-no-files-found: error
