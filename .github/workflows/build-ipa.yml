name: Build Frickbear's 3 4LD iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The full GameMaker HTML5 build is downloaded at build time so the
      # shipped IPA contains the whole game and works offline. PortAssets is a
      # small curated slice of recovered assets for the native port.
      - name: Download full web build
        run: bash Scripts/fetch-web-build.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project Frickbears3iOS.xcodeproj \
            -scheme Frickbears3iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Frickbears3iOS.app Payload/

          # XcodeGen does not reliably bundle the Game/ folder, so copy it in
          # explicitly. GameURLSchemeHandler serves from App.app/Game/.
          mkdir -p Payload/Frickbears3iOS.app/Game
          cp -R Game/. Payload/Frickbears3iOS.app/Game/

          # Curated recovered assets for the in-progress native port.
          mkdir -p Payload/Frickbears3iOS.app/PortAssets
          cp -R PortAssets/. Payload/Frickbears3iOS.app/PortAssets/

          # Fail loudly if any part of the offline bundle is missing.
          test -f Payload/Frickbears3iOS.app/Game/index.html
          grep -q "manifestFiles" Payload/Frickbears3iOS.app/Game/index.html
          for f in runner.js runner.wasm runner.data audio-worklet.js game.unx \
                   manifest.webmanifest icon-192.png runner.svg runnerLocal.svg \
                   display_mouse_lock.js NekoPresence.js; do
            test -f "Payload/Frickbears3iOS.app/Game/$f"
          done
          test -f Payload/Frickbears3iOS.app/PortAssets/manifest.json

          du -sh Payload/Frickbears3iOS.app/Game
          du -sh Payload/Frickbears3iOS.app/PortAssets
          zip -qry Frickbears3iOS.ipa Payload
          ls -lh Frickbears3iOS.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Frickbears3-4LD-IPA
          path: Frickbears3iOS.ipa
          if-no-files-found: error
